<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんたん動画つなぎ</title>
<style>
  :root {
    --main: #6F7563;
    --main-dark: #5b6151;
    --bg: #F4F0E6;
    --text: #2F3430;
    --card: #ffffff;
    --danger: #a8483b;
    --border: #ddd6c6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding-bottom: 100px;
  }
  header {
    background: var(--main);
    color: #fff;
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
  }
  main {
    padding: 12px;
    max-width: 480px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    touch-action: manipulation;
  }
  .btn-primary { background: var(--main); color: #fff; width: 100%; }
  .btn-primary:active { background: var(--main-dark); }
  .btn-secondary { background: #fff; color: var(--main); border: 1.5px solid var(--main); width: 100%; }
  .btn-outline-small { background: #fff; color: var(--text); border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; min-height: 32px; border-radius: 6px; }
  .btn-danger-small { background: #fff; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; font-size: 13px; min-height: 32px; border-radius: 6px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  #fileInput { display: none; }

  #itemList { list-style: none; margin: 0; padding: 0; }
  #itemList li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
  }
  #itemList li.dragging { opacity: 0.4; }
  .thumb-wrap {
    position: relative;
    width: 56px;
    height: 56px;
    flex: none;
    border-radius: 6px;
    overflow: hidden;
    background: #e7e2d4;
  }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-badge {
    position: absolute;
    bottom: 2px;
    left: 2px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .sec-input {
    width: 52px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 13px;
  }
  .item-controls { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .item-controls .btn-row { display: flex; gap: 4px; }

  #emptyMsg { color: #7a7568; font-size: 13px; text-align: center; padding: 20px 0; }

  #errorBanner {
    display: none;
    background: #fbe6e2;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    white-space: pre-wrap;
  }
  #warnBanner {
    display: none;
    background: #fff6df;
    border: 1px solid #c9a53b;
    color: #7a5c00;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    margin-bottom: 14px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  #previewStage {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 9/16;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #previewStage video, #previewStage img {
    max-width: 100%;
    max-height: 100%;
    display: none;
  }
  #previewLabel {
    color: #fff;
    font-size: 13px;
    margin-top: 10px;
  }
  #previewClose {
    margin-top: 14px;
  }

  #progressModal .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .progress-track {
    width: 100%;
    height: 12px;
    background: #e7e2d4;
    border-radius: 6px;
    overflow: hidden;
    margin: 14px 0 8px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--main);
    transition: width 0.2s ease;
  }
  #progressStatus { font-size: 13px; color: #555; min-height: 18px; }
  .spinner {
    width: 30px; height: 30px;
    border: 4px solid #e7e2d4;
    border-top-color: var(--main);
    border-radius: 50%;
    margin: 0 auto 10px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #resultCard { display: none; }
  #resultCard video { width: 100%; border-radius: 8px; background: #000; display: block; margin-bottom: 10px; }

  h2.section-title { font-size: 14px; margin: 0 0 10px; color: var(--text); }
  p.hint { font-size: 12px; color: #7a7568; margin: 6px 0 0; }
</style>
</head>
<body>

<header>
  <h1>かんたん動画つなぎ</h1>
</header>

<main>
  <div id="errorBanner"></div>
  <div id="warnBanner"></div>

  <div class="card">
    <h2 class="section-title">1. 動画・写真を選ぶ</h2>
    <button class="btn btn-primary" id="pickBtn" type="button">ファイルを選択</button>
    <input type="file" id="fileInput" accept="video/*,image/*" multiple>
    <p class="hint">動画・写真あわせて6個程度までを想定しています。写真は表示秒数を指定できます。</p>
  </div>

  <div class="card">
    <h2 class="section-title">2. 順番を確認・編集</h2>
    <ul id="itemList"></ul>
    <div id="emptyMsg">まだファイルが選ばれていません</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px;">
      <button class="btn btn-secondary" id="previewBtn" type="button">プレビュー再生</button>
    </div>
    <button class="btn btn-primary" id="exportBtn" type="button">書き出す</button>
    <p class="hint">書き出しは端末内で処理されます(サーバーには送信されません)。件数や長さによって数十秒〜数分かかる場合があります。</p>
  </div>

  <div class="card" id="resultCard">
    <h2 class="section-title">できあがった動画</h2>
    <video id="resultVideo" controls playsinline></video>
    <button class="btn btn-primary" id="saveBtn" type="button">保存する</button>
    <a id="downloadLink" class="hint" style="display:block;text-align:center;margin-top:8px;" download>うまく保存できない場合はこちらのリンクから</a>
  </div>
</main>

<div class="modal-overlay" id="previewModal">
  <div id="previewStage">
    <video id="previewVideo" playsinline muted></video>
    <img id="previewImg" alt="">
  </div>
  <div id="previewLabel">1 / 1</div>
  <button class="btn btn-secondary" id="previewClose" type="button">閉じる</button>
</div>

<div class="modal-overlay" id="progressModal">
  <div class="card">
    <div class="spinner"></div>
    <h2 class="section-title" id="progressTitle">書き出し中...</h2>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div id="progressStatus"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
<script>
(function () {
  'use strict';

  // ---------- State ----------
  /** @type {Array<{id:number,file:File,type:'video'|'image',url:string,name:string,duration:number,seconds:number,width:number,height:number,thumb:string}>} */
  var items = [];
  var nextId = 1;
  var MAX_ITEMS = 12;
  var RECOMMENDED_MAX = 6;
  var MAX_TOTAL_BYTES = 500 * 1024 * 1024; // 500MB
  var MAX_TOTAL_SECONDS = 180; // 3 min

  var els = {
    pickBtn: document.getElementById('pickBtn'),
    fileInput: document.getElementById('fileInput'),
    itemList: document.getElementById('itemList'),
    emptyMsg: document.getElementById('emptyMsg'),
    previewBtn: document.getElementById('previewBtn'),
    exportBtn: document.getElementById('exportBtn'),
    errorBanner: document.getElementById('errorBanner'),
    warnBanner: document.getElementById('warnBanner'),
    previewModal: document.getElementById('previewModal'),
    previewVideo: document.getElementById('previewVideo'),
    previewImg: document.getElementById('previewImg'),
    previewLabel: document.getElementById('previewLabel'),
    previewClose: document.getElementById('previewClose'),
    progressModal: document.getElementById('progressModal'),
    progressFill: document.getElementById('progressFill'),
    progressStatus: document.getElementById('progressStatus'),
    progressTitle: document.getElementById('progressTitle'),
    resultCard: document.getElementById('resultCard'),
    resultVideo: document.getElementById('resultVideo'),
    saveBtn: document.getElementById('saveBtn'),
    downloadLink: document.getElementById('downloadLink')
  };

  function showError(msg) {
    els.errorBanner.textContent = msg;
    els.errorBanner.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function clearError() {
    els.errorBanner.style.display = 'none';
    els.errorBanner.textContent = '';
  }
  function showWarn(msg) {
    els.warnBanner.textContent = msg;
    els.warnBanner.style.display = 'block';
  }
  function clearWarn() {
    els.warnBanner.style.display = 'none';
    els.warnBanner.textContent = '';
  }

  // ---------- Adding files ----------
  els.pickBtn.addEventListener('click', function () { els.fileInput.click(); });

  els.fileInput.addEventListener('change', function (e) {
    clearError();
    var files = Array.prototype.slice.call(e.target.files || []);
    els.fileInput.value = '';
    if (!files.length) return;

    var accepted = files.filter(function (f) {
      return f.type.indexOf('video/') === 0 || f.type.indexOf('image/') === 0;
    });
    if (accepted.length !== files.length) {
      showWarn('動画・写真以外のファイルは除外されました。');
    }
    if (items.length + accepted.length > MAX_ITEMS) {
      showError('一度に追加できるのは合計 ' + MAX_ITEMS + ' 個までです。追加数を減らしてください。');
      accepted = accepted.slice(0, Math.max(0, MAX_ITEMS - items.length));
      if (!accepted.length) return;
    }

    accepted.forEach(function (file) { addItem(file); });
  });

  function addItem(file) {
    var isVideo = file.type.indexOf('video/') === 0;
    var url = URL.createObjectURL(file);
    var item = {
      id: nextId++,
      file: file,
      type: isVideo ? 'video' : 'image',
      url: url,
      name: file.name,
      duration: 0,
      seconds: 3,
      width: 0,
      height: 0,
      thumb: ''
    };
    items.push(item);
    render();

    if (isVideo) {
      var v = document.createElement('video');
      v.preload = 'metadata';
      v.muted = true;
      v.playsInline = true;
      v.src = url;
      v.addEventListener('loadedmetadata', function () {
        item.duration = isFinite(v.duration) ? v.duration : 0;
        item.width = v.videoWidth;
        item.height = v.videoHeight;
        try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (err) { makeThumbFromVideo(v, item); }
      });
      v.addEventListener('seeked', function () { makeThumbFromVideo(v, item); });
      v.addEventListener('error', function () {
        item.duration = 0;
        render();
      });
    } else {
      var img = new Image();
      img.onload = function () {
        item.width = img.naturalWidth;
        item.height = img.naturalHeight;
        item.thumb = url;
        render();
      };
      img.onerror = function () {
        item.thumb = '';
        render();
      };
      img.src = url;
    }
  }

  function makeThumbFromVideo(v, item) {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = 120;
      canvas.height = 120;
      var ctx = canvas.getContext('2d');
      var vw = v.videoWidth || 1, vh = v.videoHeight || 1;
      var scale = Math.max(120 / vw, 120 / vh);
      var dw = vw * scale, dh = vh * scale;
      ctx.drawImage(v, (120 - dw) / 2, (120 - dh) / 2, dw, dh);
      item.thumb = canvas.toDataURL('image/jpeg', 0.7);
    } catch (err) {
      item.thumb = '';
    }
    render();
  }

  function removeItem(id) {
    var idx = items.findIndex(function (it) { return it.id === id; });
    if (idx === -1) return;
    URL.revokeObjectURL(items[idx].url);
    items.splice(idx, 1);
    render();
  }

  function moveItem(id, dir) {
    var idx = items.findIndex(function (it) { return it.id === id; });
    var target = idx + dir;
    if (idx === -1 || target < 0 || target >= items.length) return;
    var tmp = items[idx];
    items[idx] = items[target];
    items[target] = tmp;
    render();
  }

  // ---------- Rendering ----------
  var dragSrcIndex = null;

  function render() {
    els.itemList.innerHTML = '';
    els.emptyMsg.style.display = items.length ? 'none' : 'block';
    els.exportBtn.disabled = items.length === 0;
    els.previewBtn.disabled = items.length === 0;

    if (items.length > RECOMMENDED_MAX) {
      showWarn('件数が多いと書き出しに時間がかかったり失敗しやすくなります。' + RECOMMENDED_MAX + '個程度を推奨します。');
    } else {
      clearWarn();
    }

    items.forEach(function (item, index) {
      var li = document.createElement('li');
      li.draggable = true;
      li.dataset.id = String(item.id);

      li.addEventListener('dragstart', function () {
        dragSrcIndex = index;
        li.classList.add('dragging');
      });
      li.addEventListener('dragend', function () {
        li.classList.remove('dragging');
        dragSrcIndex = null;
      });
      li.addEventListener('dragover', function (e) { e.preventDefault(); });
      li.addEventListener('drop', function (e) {
        e.preventDefault();
        if (dragSrcIndex === null || dragSrcIndex === index) return;
        var moved = items.splice(dragSrcIndex, 1)[0];
        items.splice(index, 0, moved);
        render();
      });

      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';
      var img = document.createElement('img');
      img.src = item.thumb || '';
      img.alt = '';
      thumbWrap.appendChild(img);
      var badge = document.createElement('div');
      badge.className = 'thumb-badge';
      badge.textContent = item.type === 'video' ? '動画' : '写真';
      thumbWrap.appendChild(badge);
      li.appendChild(thumbWrap);

      var info = document.createElement('div');
      info.className = 'item-info';
      var nameEl = document.createElement('div');
      nameEl.className = 'item-name';
      nameEl.textContent = (index + 1) + '. ' + item.name;
      info.appendChild(nameEl);

      var meta = document.createElement('div');
      meta.className = 'item-meta';
      if (item.type === 'video') {
        var durText = document.createElement('span');
        durText.className = 'hint';
        durText.style.margin = '0';
        durText.textContent = item.duration ? item.duration.toFixed(1) + '秒' : '読み込み中...';
        meta.appendChild(durText);
      } else {
        var secLabel = document.createElement('span');
        secLabel.className = 'hint';
        secLabel.style.margin = '0';
        secLabel.textContent = '表示秒数:';
        meta.appendChild(secLabel);
        var secInput = document.createElement('input');
        secInput.type = 'number';
        secInput.className = 'sec-input';
        secInput.min = '0.5';
        secInput.max = '30';
        secInput.step = '0.5';
        secInput.value = item.seconds;
        secInput.addEventListener('change', function () {
          var val = parseFloat(secInput.value);
          if (!isFinite(val) || val <= 0) val = 3;
          val = Math.min(30, Math.max(0.5, val));
          item.seconds = val;
          secInput.value = val;
        });
        meta.appendChild(secInput);
      }
      info.appendChild(meta);
      li.appendChild(info);

      var controls = document.createElement('div');
      controls.className = 'item-controls';
      var row1 = document.createElement('div');
      row1.className = 'btn-row';
      var upBtn = document.createElement('button');
      upBtn.type = 'button';
      upBtn.className = 'btn-outline-small';
      upBtn.textContent = '上へ';
      upBtn.disabled = index === 0;
      upBtn.addEventListener('click', function () { moveItem(item.id, -1); });
      var downBtn = document.createElement('button');
      downBtn.type = 'button';
      downBtn.className = 'btn-outline-small';
      downBtn.textContent = '下へ';
      downBtn.disabled = index === items.length - 1;
      downBtn.addEventListener('click', function () { moveItem(item.id, 1); });
      row1.appendChild(upBtn);
      row1.appendChild(downBtn);
      controls.appendChild(row1);

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-danger-small';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', function () { removeItem(item.id); });
      controls.appendChild(delBtn);

      li.appendChild(controls);
      els.itemList.appendChild(li);
    });
  }

  // ---------- Preview playback ----------
  var previewTimer = null;
  var previewIndex = 0;

  function openPreview() {
    if (!items.length) return;
    previewIndex = 0;
    els.previewModal.classList.add('open');
    playPreviewStep();
  }

  function closePreview() {
    els.previewModal.classList.remove('open');
    if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
    els.previewVideo.pause();
    els.previewVideo.removeAttribute('src');
    els.previewVideo.style.display = 'none';
    els.previewImg.style.display = 'none';
  }

  function playPreviewStep() {
    if (previewIndex >= items.length) { closePreview(); return; }
    var item = items[previewIndex];
    els.previewLabel.textContent = (previewIndex + 1) + ' / ' + items.length + '(' + (item.type === 'video' ? '動画' : '写真') + ')';

    if (item.type === 'video') {
      els.previewImg.style.display = 'none';
      els.previewVideo.style.display = 'block';
      els.previewVideo.muted = false;
      els.previewVideo.src = item.url;
      els.previewVideo.currentTime = 0;
      var onEnded = function () {
        els.previewVideo.removeEventListener('ended', onEnded);
        previewIndex++;
        playPreviewStep();
      };
      els.previewVideo.addEventListener('ended', onEnded);
      var p = els.previewVideo.play();
      if (p && p.catch) p.catch(function () { /* autoplay blocked; user can tap controls */ });
    } else {
      els.previewVideo.pause();
      els.previewVideo.style.display = 'none';
      els.previewImg.style.display = 'block';
      els.previewImg.src = item.thumb || item.url;
      previewTimer = setTimeout(function () {
        previewIndex++;
        playPreviewStep();
      }, Math.max(300, item.seconds * 1000));
    }
  }

  els.previewBtn.addEventListener('click', openPreview);
  els.previewClose.addEventListener('click', closePreview);

  // ---------- Export (ffmpeg.wasm) ----------
  var ffmpegInstance = null;
  var ffmpegLoadingPromise = null;
  var currentSegProgress = 0;
  var totalUnits = 1;
  var completedUnits = 0;

  function toBlobURL(url, mimeType) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error('CDNからの読み込みに失敗しました (' + res.status + ')');
      return res.arrayBuffer();
    }).then(function (buf) {
      return URL.createObjectURL(new Blob([buf], { type: mimeType }));
    });
  }

  function fileToUint8Array(file) {
    return file.arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
  }

  function getFFmpeg() {
    if (ffmpegInstance) return Promise.resolve(ffmpegInstance);
    if (ffmpegLoadingPromise) return ffmpegLoadingPromise;

    setProgress(0, '動画エンジンを読み込み中... (初回のみ時間がかかります)');

    if (typeof FFmpegWASM === 'undefined') {
      ffmpegLoadingPromise = Promise.reject(new Error('動画処理エンジンの読み込みに失敗しました。通信環境を確認して、もう一度お試しください。'));
      return ffmpegLoadingPromise;
    }

    var CORE_BASE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
    var ffmpeg = new FFmpegWASM.FFmpeg();
    ffmpeg.on('progress', function (e) {
      var p = e && typeof e.progress === 'number' ? e.progress : 0;
      if (!isFinite(p) || p < 0) p = 0;
      if (p > 1) p = 1;
      currentSegProgress = p;
      renderProgress();
    });

    ffmpegLoadingPromise = Promise.all([
      toBlobURL(CORE_BASE + '/ffmpeg-core.js', 'text/javascript'),
      toBlobURL(CORE_BASE + '/ffmpeg-core.wasm', 'application/wasm')
    ]).then(function (urls) {
      return ffmpeg.load({ coreURL: urls[0], wasmURL: urls[1] });
    }).then(function () {
      ffmpegInstance = ffmpeg;
      return ffmpeg;
    }).catch(function (err) {
      ffmpegLoadingPromise = null;
      throw new Error('動画処理エンジンの読み込みに失敗しました。通信環境を確認して、もう一度お試しください。');
    });

    return ffmpegLoadingPromise;
  }

  function setProgress(unitsDone, statusText) {
    completedUnits = unitsDone;
    currentSegProgress = 0;
    renderProgress();
    els.progressStatus.textContent = statusText || '';
  }

  function renderProgress() {
    var pct = Math.min(100, Math.round(((completedUnits + currentSegProgress) / totalUnits) * 100));
    els.progressFill.style.width = pct + '%';
  }

  function openProgressModal() {
    els.progressModal.classList.add('open');
  }
  function closeProgressModal() {
    els.progressModal.classList.remove('open');
  }

  function computeTargetResolution() {
    var first = items[0];
    var landscape = first.width && first.height ? first.width >= first.height : true;
    return landscape ? { w: 1280, h: 720 } : { w: 720, h: 1280 };
  }

  function imageToPngBytes(item, w, h) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        try {
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, w, h);
          var iw = img.naturalWidth || w, ih = img.naturalHeight || h;
          var scale = Math.min(w / iw, h / ih);
          var dw = iw * scale, dh = ih * scale;
          ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
          canvas.toBlob(function (blob) {
            if (!blob) { reject(new Error('画像の変換に失敗しました')); return; }
            blob.arrayBuffer().then(function (buf) { resolve(new Uint8Array(buf)); });
          }, 'image/png');
        } catch (err) { reject(err); }
      };
      img.onerror = function () { reject(new Error('画像の読み込みに失敗しました: ' + item.name)); };
      img.src = item.url;
    });
  }

  function validateBeforeExport() {
    if (!items.length) return 'まず動画・写真を追加してください。';
    var totalBytes = items.reduce(function (s, it) { return s + it.file.size; }, 0);
    if (totalBytes > MAX_TOTAL_BYTES) {
      return '合計ファイルサイズが大きすぎます(' + Math.round(totalBytes / 1024 / 1024) + 'MB)。500MB以下になるように減らしてください。';
    }
    var totalSeconds = items.reduce(function (s, it) { return s + (it.type === 'video' ? (it.duration || 0) : it.seconds); }, 0);
    if (totalSeconds > MAX_TOTAL_SECONDS) {
      return '合計の長さが長すぎます(約' + Math.round(totalSeconds) + '秒)。3分以内になるように減らしてください。';
    }
    var pending = items.some(function (it) { return it.type === 'video' && !it.duration; });
    if (pending) return '動画の読み込みが完了していません。少し待ってからもう一度お試しください。';
    return null;
  }

  els.exportBtn.addEventListener('click', function () {
    clearError();
    var problem = validateBeforeExport();
    if (problem) { showError(problem); return; }
    runExport().catch(function (err) {
      console.error(err);
      showError((err && err.message) ? err.message : '書き出し中に予期しないエラーが発生しました。ファイルの数や長さを減らしてもう一度お試しください。');
    });
  });

  function runExport() {
    els.resultCard.style.display = 'none';
    totalUnits = items.length + 1; // +1 for final concat step
    completedUnits = 0;
    currentSegProgress = 0;
    els.progressTitle.textContent = '書き出し中...';
    openProgressModal();

    var createdFiles = [];
    var ffmpeg;

    return getFFmpeg().then(function (fx) {
      ffmpeg = fx;
      var target = computeTargetResolution();
      var chain = Promise.resolve();
      var listLines = [];

      items.forEach(function (item, i) {
        chain = chain.then(function () {
          setProgress(i, ((i + 1) + ' / ' + items.length) + ' 個目を処理中... (' + (item.type === 'video' ? '動画' : '写真') + ')');
          var segName = 'seg' + i + '.mp4';
          if (item.type === 'image') {
            return imageToPngBytes(item, target.w, target.h).then(function (bytes) {
              var imgName = 'img' + i + '.png';
              return ffmpeg.writeFile(imgName, bytes).then(function () {
                createdFiles.push(imgName);
                return ffmpeg.exec([
                  '-loop', '1', '-i', imgName,
                  '-t', String(item.seconds),
                  '-r', '25', '-an', '-pix_fmt', 'yuv420p',
                  '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23',
                  segName
                ]);
              }).then(function () {
                createdFiles.push(segName);
                listLines.push("file '" + segName + "'");
              });
            });
          } else {
            var inName = 'in' + i + (guessExt(item.file.name) || '.mp4');
            return fileToUint8Array(item.file).then(function (bytes) {
              return ffmpeg.writeFile(inName, bytes);
            }).then(function () {
              createdFiles.push(inName);
              var vf = 'scale=' + target.w + ':' + target.h + ':force_original_aspect_ratio=decrease,pad=' + target.w + ':' + target.h + ':(ow-iw)/2:(oh-ih)/2,setsar=1';
              return ffmpeg.exec([
                '-i', inName,
                '-vf', vf,
                '-r', '25', '-an', '-pix_fmt', 'yuv420p',
                '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23',
                segName
              ]);
            }).then(function () {
              createdFiles.push(segName);
              listLines.push("file '" + segName + "'");
            });
          }
        });
      });

      chain = chain.then(function () {
        setProgress(items.length, '動画を結合中...');
        var listBytes = new TextEncoder().encode(listLines.join('\n'));
        return ffmpeg.writeFile('list.txt', listBytes).then(function () {
          createdFiles.push('list.txt');
          return ffmpeg.exec(['-f', 'concat', '-safe', '0', '-i', 'list.txt', '-c', 'copy', 'output.mp4']);
        });
      });

      return chain.then(function () {
        createdFiles.push('output.mp4');
        return ffmpeg.readFile('output.mp4');
      });
    }).then(function (data) {
      setProgress(items.length + 1, '仕上げています...');
      var blob = new Blob([data.buffer], { type: 'video/mp4' });
      cleanupFiles(ffmpeg, createdFiles);
      closeProgressModal();
      showResult(blob);
    }).catch(function (err) {
      cleanupFiles(ffmpeg, createdFiles);
      closeProgressModal();
      throw err;
    });
  }

  function guessExt(name) {
    var m = /\.[a-zA-Z0-9]+$/.exec(name || '');
    return m ? m[0] : '';
  }

  function cleanupFiles(ffmpeg, files) {
    if (!ffmpeg) return;
    files.forEach(function (f) {
      try {
        var p = ffmpeg.deleteFile(f);
        if (p && p.catch) p.catch(function () { /* ignore */ });
      } catch (err) { /* ignore */ }
    });
  }

  function showResult(blob) {
    var url = URL.createObjectURL(blob);
    var filename = 'edited_video_' + Date.now() + '.mp4';
    els.resultVideo.src = url;
    els.downloadLink.href = url;
    els.downloadLink.download = filename;
    els.resultCard.style.display = 'block';
    els.resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

    var file;
    try { file = new File([blob], filename, { type: 'video/mp4' }); } catch (err) { file = null; }

    els.saveBtn.onclick = function () {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: '動画' }).catch(function () { /* user cancelled */ });
      } else {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    };
  }

})();
</script>
</body>
</html>
